app-id: com.jetbrains.Rider
runtime: org.freedesktop.Sdk
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: rider-wrapper
separate-locales: false
tags:
  - proprietary
finish-args:
  # Direct Rendering Infrastructure, for GPU access
  - --device=dri
  # Enable Flatpak .Net SDKs, see this page for supported frameworks:
  # https://dotnet.microsoft.com/en-us/platform/support/policy/dotnet-core
  - --env=FLATPAK_ENABLE_SDK_EXT=dotnet8,dotnet9,dotnet10
  # Rider Java runtime
  - --env=RIDER_JDK=${FLATPAK_DEST}/extra/rider/jre64
  # File system access
  # TODO: Change to --filesystem=home?
  - --filesystem=host
  # Necessary for reasonable X11 performance
  - --share=ipc
  # Network access, necessary for plugin updates and various IDE-specific functionality
  - --share=network
  # Wayland desktop
  - --socket=wayland
  # Talking to X11
  # Note that this needs to be "x11" and not "fallback-x11", due to UI-specific functionality in Rider
  # At some point we should be able to remove this/replace with "fallback-x11"
  # https://github.com/flathub/com.jetbrains.Rider/issues/168
  - --socket=x11
  # Use the host file manager
  - --talk-name=org.freedesktop.FileManager1
  # For spawning processes on the host
  - --talk-name=org.freedesktop.Flatpak
  # Secrets portal, for storing credentials in the host keyring
  - --talk-name=org.freedesktop.secrets
  # TODO: Can we remove these?
  # - --filesystem=xdg-run/keyring
  # - --socket=pulseaudio
  # - --socket=session-bus
  # - --talk-name=org.freedesktop.Notifications
modules:
  - name: rider
    buildsystem: simple
    build-commands:
      # App binaries
      - cp -a JetBrains\ Rider-*/* ${FLATPAK_DEST}
      # host-spawn, used for starting processes on the host, like a terminal, and docker
      # Desktop file
      - install -D -m755 host-spawn ${FLATPAK_DEST}/bin
      - install -D -m644 -t ${FLATPAK_DEST}/share/applications/ ${FLATPAK_ID}.desktop
      # Flatpak metadata
      - install -D -m644 -t ${FLATPAK_DEST}/share/metainfo/ ${FLATPAK_ID}.metainfo.xml
      # Icon
      - install -D -m644 /app/bin/rider.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg

    sources:
      # App binaries - x86_64
      - type: archive
        strip-components: 0
        url: https://download.jetbrains.com/rider/JetBrains.Rider-2026.2.3.1.tar.gz
        sha256: fa4b09a5f7cf4b6635b093adc7313991778a8dc74f25614a2b8976b04dee5d4e
        only-arches:
          - x86_64
        x-checker-data:
          type: jetbrains
          code: RD
          is-main-source: true

      # App binaries - aarch64
      - type: archive
        strip-components: 0
        url: https://download.jetbrains.com/rider/JetBrains.Rider-2026.2.3.1-aarch64.tar.gz
        sha256: 8239c1e7c0352a9fb79dcbf68fb9550d64b215606a635ed88981291d92995a61
        only-arches:
          - aarch64
        x-checker-data:
          type: jetbrains
          code: RD
          is-main-source: true

      # host-spawn - x86_64
      - type: file
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-x86_64
        dest-filename: host-spawn
        sha256: 077bc09a087292447ba17cfe2156a93f71bf56c4c6be8e38d3abe65c1240f34c
        only-arches:
          - x86_64

      # host-spawn - aarch64
      - type: file
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-aarch64
        dest-filename: host-spawn
        sha256: 077bc09a087292447ba17cfe2156a93f71bf56c4c6be8e38d3abe65c1240f34c
        only-arches:
          - aarch64

      # Desktop file
      - type: file
        path: com.jetbrains.Rider.desktop

      # Flatpak metadata
      - type: file
        path: com.jetbrains.Rider.metainfo.xml

  - name: ide-flatpak-wrapper
    buildsystem: meson
    config-opts:
      - -Deditor_binary=/app/bin/rider
      - -Dprogram_name=rider-wrapper
      - -Deditor_title=Rider
    sources:
      - type: git
        url: https://github.com/flathub-infra/ide-flatpak-wrapper.git
        commit: d581fd9b873acbf6fb22899aa388435f6c00f61a
