app-id: com.jetbrains.Rider
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: rider-wrapper
separate-locales: false
tags:
  - proprietary
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  - --socket=pulseaudio
  - --filesystem=host
  - --filesystem=xdg-run/keyring
  - --socket=session-bus
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.FileManager1
  - --device=all
  - --env=RIDER_JDK=${FLATPAK_DEST}/extra/rider/jre64
modules:

  - name: rider
    buildsystem: simple
    build-commands:
      - unzip rider_logos.zip
      - cp -a JetBrains\ Rider-*/* ${FLATPAK_DEST}
      - install -D -m644 rider_logos/icon-rider.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -D -m644 -t ${FLATPAK_DEST}/share/applications/ ${FLATPAK_ID}.desktop
      - install -D -m644 -t ${FLATPAK_DEST}/share/metainfo/ ${FLATPAK_ID}.metainfo.xml
      - cat idea.properties | tee -a ${FLATPAK_DEST}/bin/idea.properties

    sources:

      # App binaries - x64
      - type: archive
        strip-components: 0
        url: https://download.jetbrains.com/rider/JetBrains.Rider-2026.2.3.1.tar.gz
        sha256: fa4b09a5f7cf4b6635b093adc7313991778a8dc74f25614a2b8976b04dee5d4e
        only-arches:
          - x86_64
        x-checker-data:
          type: jetbrains
          code: RD
          is-main-source: true

      # App binaries - arm64
      - type: archive
        strip-components: 0
        url: https://download.jetbrains.com/rider/JetBrains.Rider-2026.2.3.1-aarch64.tar.gz
        sha256: 8239c1e7c0352a9fb79dcbf68fb9550d64b215606a635ed88981291d92995a61
        only-arches:
          - aarch64
        x-checker-data:
          type: jetbrains
          code: RD
          is-main-source: true

      # Desktop file
      - type: file
        path: com.jetbrains.Rider.desktop

      # Flatpak metadata
      - type: file
        path: com.jetbrains.Rider.metainfo.xml

      # Icons
      - type: file
        sha256: 894d2776d31ac722a2958f4dfd549652b4ea2c1615aafd403cdd7a3277e02850
        url: https://resources.jetbrains.com/storage/products/rider/docs/rider_logos.zip

      # Rider settings
      - type: file
        path: idea.properties

  - name: ide-flatpak-wrapper
    buildsystem: meson
    config-opts:
      - -Deditor_binary=/app/bin/rider
      - -Dprogram_name=rider-wrapper
      - -Deditor_title=Rider
    sources:
      - type: git
        url: https://github.com/flathub-infra/ide-flatpak-wrapper.git
        commit: d581fd9b873acbf6fb22899aa388435f6c00f61a
